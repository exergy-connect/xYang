name: xyang-ts
description: >-
  Download xyang-ts.mjs from a GitHub Release and run the CLI
  (no npm install or build). Use from other repositories to validate YANG modules in CI.

inputs:
  repository:
    description: GitHub repository that hosts xYang
    required: false
    default: exergy-connect/xYang
  version:
    description: Release tag whose xyang-ts.mjs asset to download, or latest
    required: false
    default: latest
  command:
    description: xyang-ts subcommand (parse, validate, convert). Omit to only expose xyang-ts on PATH.
    required: false
    default: ""
  yang-file:
    description: YANG module file path (required when command is set)
    required: false
    default: ""
  data-file:
    description: JSON instance file for validate (optional for parse and convert)
    required: false
    default: ""
  include-path:
    description: Module search directories mapped to --include-path (one path per line)
    required: false
    default: ""
  working-directory:
    description: Working directory for the xyang-ts command
    required: false
    default: ""

outputs:
  cli:
    description: Absolute path to the downloaded xyang-ts.mjs
    value: ${{ steps.setup.outputs.cli }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - id: setup
      name: Download xyang-ts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        XYANG_REPOSITORY: ${{ inputs.repository }}
        XYANG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        REPO="${XYANG_REPOSITORY}"
        TAG="${XYANG_VERSION}"
        CLI="${RUNNER_TEMP}/xyang-ts.mjs"

        if [ -z "$REPO" ] || [ -z "$TAG" ]; then
          echo "::error::Failed to download xyang-ts.mjs from release ${TAG} of ${REPO}: repository and version are required."
          exit 1
        fi

        if ! command -v gh >/dev/null 2>&1; then
          echo "::error::Failed to download xyang-ts.mjs from release ${TAG} of ${REPO}: gh is not installed."
          exit 1
        fi

        if [ "$TAG" = "latest" ]; then
          if ! gh release download --repo "$REPO" --pattern "xyang-ts.mjs" --dir "${RUNNER_TEMP}" --clobber; then
            echo "::error::Failed to download xyang-ts.mjs from release ${TAG} of ${REPO}."
            exit 1
          fi
        else
          if ! gh release download "$TAG" --repo "$REPO" --pattern "xyang-ts.mjs" --dir "${RUNNER_TEMP}" --clobber; then
            echo "::error::Failed to download xyang-ts.mjs from release ${TAG} of ${REPO}."
            exit 1
          fi
        fi

        if [ ! -f "$CLI" ]; then
          echo "::error::Failed to download xyang-ts.mjs from release ${TAG} of ${REPO}: asset missing after download."
          exit 1
        fi

        chmod +x "$CLI"

        BIN_DIR="${RUNNER_TEMP}/xyang-ts-bin"
        mkdir -p "$BIN_DIR"
        {
          echo '#!/usr/bin/env bash'
          echo "exec node \"${CLI}\" \"\$@\""
        } > "${BIN_DIR}/xyang-ts"
        chmod +x "${BIN_DIR}/xyang-ts"
        echo "${BIN_DIR}" >> "$GITHUB_PATH"

        echo "cli=${CLI}" >> "$GITHUB_OUTPUT"

    - name: Run xyang-ts
      if: inputs.command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INCLUDE_PATHS: ${{ inputs.include-path }}
      run: |
        set -euo pipefail

        if [ -z "${{ inputs.yang-file }}" ]; then
          echo "::error::yang-file is required when command is set"
          exit 1
        fi

        cmd_args=()

        if [ -n "$INCLUDE_PATHS" ]; then
          while IFS= read -r dir || [ -n "$dir" ]; do
            [ -z "$dir" ] && continue
            cmd_args+=(--include-path "$dir")
          done <<< "$INCLUDE_PATHS"
        fi

        cmd_args+=("${{ inputs.yang-file }}")

        if [ -n "${{ inputs.data-file }}" ]; then
          cmd_args+=("${{ inputs.data-file }}")
        fi

        xyang-ts ${{ inputs.command }} "${cmd_args[@]}"
