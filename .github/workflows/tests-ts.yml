# Lint, build, and test TypeScript.
# A head-commit trailer line `Local-Tests: passed` skips the Node matrix on
# pull requests (and on pushes that are not main). Pushes to main, tags, and
# releases always run the matrix.
# Required Checks (TypeScript) always reports on pull requests (success when no
# TS paths changed, or when the matrix was skipped because of that trailer).

name: Tests (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - "ts/**"
      - "docs/**"
      - "tests/cases/**"
      - ".github/workflows/tests-ts.yml"
      - ".nvmrc"
      - ".node-version"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-ts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.detect.outputs.typescript }}
      local_tests_passed: ${{ steps.trailer.outputs.local_tests_passed }}
      head_sha: ${{ steps.trailer.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read head commit message
        id: trailer
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          set -euo pipefail
          head_sha="${GITHUB_SHA}"
          local_tests_passed=false

          # Never skip heavy CI on pushes to main, tags, or releases.
          if [ "${GITHUB_EVENT_NAME}" = "release" ] || [[ "${GITHUB_REF}" == refs/tags/* ]] || { [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; }; then
            echo "local_tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            head_sha="${PR_HEAD_SHA}"
            msg="$(git log -1 --format=%B "${PR_HEAD_SHA}")"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            head_sha="${HEAD_COMMIT_ID:-${GITHUB_SHA}}"
            msg="${HEAD_COMMIT_MESSAGE}"
          else
            echo "local_tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          msg="${msg//$'\r'/}"
          if printf '%s\n' "${msg}" | grep -qx 'Local-Tests: passed'; then
            local_tests_passed=true
          fi
          echo "local_tests_passed=${local_tests_passed}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          if [ "${local_tests_passed}" = "true" ]; then
            echo "Head ${head_sha} attests Local-Tests: passed; heavy jobs will be skipped."
          fi

      - name: Detect TypeScript-relevant changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "typescript=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -qE '^(ts/|docs/|tests/cases/|\.github/workflows/tests-ts\.yml$|\.nvmrc$|\.node-version$)'; then
            echo "typescript=true" >> "$GITHUB_OUTPUT"
          else
            echo "typescript=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Node ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' && needs.changes.outputs.local_tests_passed != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: nvmrc
            name: minimum
          - source: lts/*
            name: latest LTS

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Resolve Node.js version
        id: node
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.source }}" = "nvmrc" ]; then
            version="$(tr -d '[:space:]' < .nvmrc)"
          else
            version="${{ matrix.source }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Lint (typecheck)
        working-directory: ts
        run: npm run lint

      - name: Build
        working-directory: ts
        run: npm run build:check

      - name: Build CI artifacts
        working-directory: ts
        run: npm run build:ci

      - name: Test
        working-directory: ts
        run: npm test

  required-check:
    name: Required Checks (TypeScript)
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()

    steps:
      - name: Report required status
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TYPESCRIPT_CHANGES: ${{ needs.changes.outputs.typescript }}
          LOCAL_TESTS_PASSED: ${{ needs.changes.outputs.local_tests_passed }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${CHANGES_RESULT}" == "failure" || "${CHANGES_RESULT}" == "cancelled" ]]; then
            echo "Detect changes ${CHANGES_RESULT}."
            exit 1
          fi
          if [[ "${TEST_RESULT}" == "failure" || "${TEST_RESULT}" == "cancelled" ]]; then
            echo "Node tests ${TEST_RESULT}."
            exit 1
          fi
          if [ "${LOCAL_TESTS_PASSED}" = "true" ] && [ "${TEST_RESULT}" = "skipped" ]; then
            line="Heavy CI skipped: commit attests Local-Tests: passed (${HEAD_SHA})"
            echo "============================================================"
            echo "${line}"
            echo "============================================================"
            echo "${line}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${TYPESCRIPT_CHANGES}" != "true" ]; then
            echo "No TypeScript changes in this pull request."
            exit 0
          fi
          if [[ "${TEST_RESULT}" != "success" ]]; then
            exit 1
          fi
