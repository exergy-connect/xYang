# Publish only after the release benchmark README update is merged to main.
#
# One-time PyPI setup (Trusted Publishing — no API token in GitHub secrets):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   PyPI → xyang project → Settings → Publishing → "Add a new pending publisher"
#   - Owner/repo: this repository
#   - Workflow: publish-pypi.yml
#   - Environment name: leave empty unless you use the optional `environment:` block below
#
# Before each release: bump `version` in pyproject.toml.

name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: ["benchmarks/results/latest.json"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release benchmark and README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python benchmarks/check_release_readme.py

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Upload to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # Uncomment and create a GitHub Environment named `pypi` if you configured
    # that name on PyPI's trusted publisher (optional protection rules / reviewers).
    # environment:
    #   name: pypi
    #   url: https://pypi.org/p/xyang
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
