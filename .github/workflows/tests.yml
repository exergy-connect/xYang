# Run the test suite on pushes and PRs that touch library code.
# Matrix: one parallel job per Python version (3.11–3.15).
# A head-commit trailer line `Local-Tests: passed` skips the matrix on pull
# requests (and on pushes that are not main). Pushes to main, tags, and
# releases always run the matrix.
# Required Checks always reports on pull requests (success when no Python paths
# changed, or when the matrix was skipped because of that trailer).

name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      local_tests_passed: ${{ steps.trailer.outputs.local_tests_passed }}
      head_sha: ${{ steps.trailer.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read head commit message
        id: trailer
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          set -euo pipefail
          head_sha="${GITHUB_SHA}"
          local_tests_passed=false

          # Never skip heavy CI on pushes to main, tags, or releases.
          if [ "${GITHUB_EVENT_NAME}" = "release" ] || [[ "${GITHUB_REF}" == refs/tags/* ]] || { [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; }; then
            echo "local_tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            head_sha="${PR_HEAD_SHA}"
            msg="$(git log -1 --format=%B "${PR_HEAD_SHA}")"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            head_sha="${HEAD_COMMIT_ID:-${GITHUB_SHA}}"
            msg="${HEAD_COMMIT_MESSAGE}"
          else
            echo "local_tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          msg="${msg//$'\r'/}"
          if printf '%s\n' "${msg}" | grep -qx 'Local-Tests: passed'; then
            local_tests_passed=true
          fi
          echo "local_tests_passed=${local_tests_passed}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          if [ "${local_tests_passed}" = "true" ]; then
            echo "Head ${head_sha} attests Local-Tests: passed; heavy jobs will be skipped."
          fi

      - name: Detect Python-relevant changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -qE '^(src/|tests/|pyproject\.toml$|\.github/workflows/tests\.yml$)'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' && needs.changes.outputs.local_tests_passed != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The registry parity tests run ts/scripts/dump-*.mjs, which import esbuild.
      # A bare runner Node has no ts/node_modules, so those tests exit 1.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: ts
        run: npm ci

      - name: Run tests
        run: pytest --tb=short -q

      - name: Test inventory
        if: matrix.python-version == '3.13'
        run: |
          { echo '```'; python tests/inventory.py; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  required-check:
    name: Required Checks
    runs-on: ubuntu-latest
    needs: [changes, pytest]
    if: always()

    steps:
      - name: Report required status
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          PYTHON_CHANGES: ${{ needs.changes.outputs.python }}
          LOCAL_TESTS_PASSED: ${{ needs.changes.outputs.local_tests_passed }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${CHANGES_RESULT}" == "failure" || "${CHANGES_RESULT}" == "cancelled" ]]; then
            echo "Detect changes ${CHANGES_RESULT}."
            exit 1
          fi
          if [[ "${PYTEST_RESULT}" == "failure" || "${PYTEST_RESULT}" == "cancelled" ]]; then
            echo "Python tests ${PYTEST_RESULT}."
            exit 1
          fi
          if [ "${LOCAL_TESTS_PASSED}" = "true" ] && [ "${PYTEST_RESULT}" = "skipped" ]; then
            line="Heavy CI skipped: commit attests Local-Tests: passed (${HEAD_SHA})"
            echo "============================================================"
            echo "${line}"
            echo "============================================================"
            echo "${line}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${PYTHON_CHANGES}" != "true" ]; then
            echo "No Python changes in this pull request."
            exit 0
          fi
          if [[ "${PYTEST_RESULT}" != "success" ]]; then
            exit 1
          fi
