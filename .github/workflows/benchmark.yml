# Release benchmark: Python/TypeScript time, memory, source lines, and Zig binary size.
#
# - pull_request smoke checks run in zig.yml using that workflow's Zig build.
# - after the release Zig build succeeds: full run on its release tag. Results are uploaded as a
#   workflow artifact and attached to the release, and a pull request against main
#   refreshes README.md and benchmarks/results/latest.json.
# - workflow_dispatch: full run using an existing Zig release-workflow run ID;
#   artifact only, unless open_pr is true.
#
# PUBLISH_BENCHMARK_TOKEN pushes and opens the benchmark pull request; the
# workflow GITHUB_TOKEN attaches results to the release. A failed measurement
# fails the job before anything is attached, pushed, or proposed.

name: Benchmark

on:
  workflow_run:
    workflows: ["Release Zig binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      zig_run_id:
        description: Successful Release Zig binaries workflow run ID for the selected ref
        type: string
        required: true
      open_pr:
        description: Push a branch and open a pull request that refreshes the README benchmark section
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Download the exact Zig build
        uses: actions/download-artifact@v8
        with:
          name: zig-benchmark-build
          path: ${{ runner.temp }}/zig-benchmark
          run-id: ${{ github.event.workflow_run.id || inputs.zig_run_id }}
          github-token: ${{ github.token }}

      - id: meta
        name: Verify Zig build provenance
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re
          from pathlib import Path
          build_dir = Path(os.environ['RUNNER_TEMP']) / 'zig-benchmark'
          manifest = json.loads((build_dir / 'benchmark-manifest.json').read_text())
          binary = build_dir / 'xyang-zig-linux-x64'
          if manifest['commit'] != os.environ['EXPECTED_SHA']:
              raise SystemExit('Zig artifact does not match the requested commit')
          if hashlib.sha256(binary.read_bytes()).hexdigest() != manifest['sha256']:
              raise SystemExit('Zig artifact checksum does not match its manifest')
          tag = manifest['tag']
          if tag and not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Invalid release tag in Zig artifact')
          if os.environ['EVENT_NAME'] == 'workflow_run' and not tag:
              raise SystemExit('Release Zig artifact has no release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"commit={manifest['commit']}\ntag={tag}\n")
          PYCODE

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.commit }}
          fetch-depth: 0

      - name: Install the shared Zig binary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$COMMIT" ]; fi
          mkdir -p zig/zig-out-benchmark/bin
          cp "$RUNNER_TEMP/zig-benchmark/xyang-zig-linux-x64" zig/zig-out-benchmark/bin/xyang-zig
          chmod +x zig/zig-out-benchmark/bin/xyang-zig

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          cd ts && npm ci

      - name: Run benchmark
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          args=(run --out bench-out/results.json --zig-binary zig/zig-out-benchmark/bin/xyang-zig --zig-cli zig/zig-out-benchmark/bin/xyang-zig --zig-build ReleaseSafe)
          if [ -n "${TAG}" ]; then args+=(--release-tag "${TAG}"); fi
          python benchmarks/release_bench.py "${args[@]}"

      - name: Compare with the previous release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName |
            jq -r --arg tag "$TAG" '[.[] | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | {tag: ., ver: (.[1:] | split(".") | map(tonumber))}] | map(select(.ver < ($tag[1:] | split(".") | map(tonumber)))) | sort_by(.ver) | last | .tag // empty')"
          if [ -z "$previous" ]; then
            echo "No previous release; percentage comparisons are unavailable."
            exit 0
          fi
          asset="benchmark-${previous}.json"
          if [ "$(gh release view "$previous" --json assets --jq ".assets | any(.name == \"$asset\")")" != "true" ]; then
            echo "No benchmark asset for $previous; percentage comparisons are unavailable."
            exit 0
          fi
          gh release download "$previous" --pattern "$asset" --dir bench-out
          python benchmarks/release_bench.py compare bench-out/results.json "bench-out/$asset" --previous-tag "$previous"

      - name: Render benchmark results
        run: |
          python benchmarks/release_bench.py render bench-out/results.json > bench-out/README-section.md
          cat bench-out/README-section.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-out/
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: measure
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: bench-out

      - name: Upload results to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.measure.outputs.tag }}
        run: |
          cp bench-out/results.json "benchmark-${TAG}.json"
          gh release upload "$TAG" "benchmark-${TAG}.json" --clobber --repo "$GITHUB_REPOSITORY"

  readme-pr:
    name: README pull request
    needs: measure
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.open_pr)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PUBLISH_BENCHMARK_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: bench-out

      - name: Update README benchmark section
        run: |
          cp bench-out/results.json benchmarks/results/latest.json
          python benchmarks/release_bench.py update-readme benchmarks/results/latest.json

      - name: Push branch and open pull request
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_BENCHMARK_TOKEN }}
          TAG: ${{ needs.measure.outputs.tag }}
          MEASURED_COMMIT: ${{ needs.measure.outputs.commit }}
        run: |
          set -euo pipefail
          label="${TAG:-${MEASURED_COMMIT::12}}"
          branch="benchmark/${label}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md benchmarks/results/latest.json
          if git diff --cached --quiet; then
            echo "README benchmark section already up to date."
            exit 0
          fi
          git commit -m "Refresh README benchmark results for ${label}."
          git push origin "$branch"
          title="Refresh README benchmark results for ${label}"
          body="Measured by the Benchmark workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${MEASURED_COMMIT})."
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::error::Could not open the pull request. Check PUBLISH_BENCHMARK_TOKEN and open it by hand: ${url}"
            echo "Open the README benchmark pull request by hand: ${url}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
