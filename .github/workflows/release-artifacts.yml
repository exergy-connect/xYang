# Build the TypeScript CLI and browser bundles and attach them to a GitHub Release.
# Not part of pull-request CI. Runs when a release is published, and on a
# manual workflow_dispatch (build only; files are uploaded as workflow
# artifacts and are not attached to a release).

name: Release TypeScript artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Build CI artifacts
        working-directory: ts
        run: npm run build:ci

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: xyang-ts-artifacts
          path: |
            artifacts/xyang-ts.mjs
            docs/xyang.umd.min.js
          if-no-files-found: error

      - name: Attach artifacts to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/xyang-ts.mjs docs/xyang.umd.min.js --clobber
