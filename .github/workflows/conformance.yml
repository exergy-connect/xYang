# Run the shared conformance cases (tests/cases) against every implementation.
# No path filters: a change to either implementation or to a case must keep both runners green.
# A head-commit trailer line `Local-Tests: passed` skips both runners on pull
# requests (and on pushes that are not main). Pushes to main, tags, and
# releases always run them.

name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      local_tests_passed: ${{ steps.trailer.outputs.local_tests_passed }}
      head_sha: ${{ steps.trailer.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read head commit message
        id: trailer
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          set -euo pipefail
          head_sha="${GITHUB_SHA}"
          local_tests_passed=false

          # Never skip heavy CI on pushes to main, tags, or releases.
          if [ "${GITHUB_EVENT_NAME}" = "release" ] || [[ "${GITHUB_REF}" == refs/tags/* ]] || { [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; }; then
            echo "local_tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            head_sha="${PR_HEAD_SHA}"
            msg="$(git log -1 --format=%B "${PR_HEAD_SHA}")"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            head_sha="${HEAD_COMMIT_ID:-${GITHUB_SHA}}"
            msg="${HEAD_COMMIT_MESSAGE}"
          else
            echo "local_tests_passed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          msg="${msg//$'\r'/}"
          if printf '%s\n' "${msg}" | grep -qx 'Local-Tests: passed'; then
            local_tests_passed=true
          fi
          echo "local_tests_passed=${local_tests_passed}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          if [ "${local_tests_passed}" = "true" ]; then
            echo "Head ${head_sha} attests Local-Tests: passed; heavy jobs will be skipped."
          fi

  python:
    name: Python cases
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.local_tests_passed != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run shared cases
        run: pytest tests/test_cases.py -q -rxX

  typescript:
    name: TypeScript cases
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.local_tests_passed != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Run shared cases
        working-directory: ts
        run: npx vitest run test/cases.test.ts
